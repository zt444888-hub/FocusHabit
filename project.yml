name: FocusHabit
options:
  bundleIdPrefix: com.a1111
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  FocusHabit:
    type: application
    platform: iOS
    sources:
      - FocusHabit/Views
      - FocusHabit/Models
      - FocusHabit/Managers
      - FocusHabit/Resources
      - FocusHabit/Assets.xcassets
      - FocusHabit/PrivacyInfo.xcprivacy
      - FocusHabit/FocusHabitApp.swift
      - FocusHabit/Theme.swift
      - Shared
    info:
      path: FocusHabit/Info.plist
      properties:
        CFBundleDisplayName: FocusHabit Pro
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "5"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - focushabit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.a1111.FocusHabit
      DEVELOPMENT_TEAM: "2VBHV3VJ8N"
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: FocusHabit/FocusHabit.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.a1111.FocusHabit

  FocusHabitWidget:
    type: app-extension
    platform: iOS
    sources:
      - FocusHabitWidget
      - FocusHabit/Assets.xcassets
      - FocusHabit/PrivacyInfo.xcprivacy
      - Shared
      - FocusHabit/Theme.swift
    info:
      path: FocusHabitWidget/Info.plist
      properties:
        CFBundleDisplayName: FocusHabit Pro Widget
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "5"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.a1111.FocusHabit.FocusHabitWidget
      DEVELOPMENT_TEAM: "2VBHV3VJ8N"
      CODE_SIGN_STYLE: Automatic
    entitlements:
      path: FocusHabitWidget/FocusHabitWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.a1111.FocusHabit

  FocusHabitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FocusHabitTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.a1111.FocusHabitTests
      DEVELOPMENT_TEAM: "2VBHV3VJ8N"
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FocusHabit
